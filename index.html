<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>擇木良食 出貨管理</title>
<script>
  /* ★ 把下面這行換成你的 Apps Script 網頁應用程式網址（/exec 結尾） ★
     在 Apps Script → 部署 → 管理部署作業 裡複製。
     之後改程式只要「編輯 → 新版本 → 部署」，這個網址不會變，這裡也不用再動。 */
  var APP_URL = "https://script.google.com/macros/s/AKfycbzY122qewLKoPQZOQR34AM2Ma-7aF6M663z8SalcDfDxE6fK0t8p71r-XbZEn7csUvOlQ/exec";
</script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#1B2733;color:#fff;
       font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif}
  .card{text-align:center;padding:32px 28px;max-width:420px}
  .mark{font-size:22px;font-weight:700;letter-spacing:.14em;margin-bottom:6px}
  .mark span{color:#B67A18}
  p{color:#93A3B1;font-size:14px;line-height:1.7;margin:10px 0 0}
  a.btn{display:inline-block;margin-top:18px;background:#B67A18;color:#fff;
        text-decoration:none;padding:11px 24px;border-radius:6px;font-weight:600}
  a.btn:hover{background:#96620F}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#B67A18;
       margin:0 3px;animation:b 1.2s infinite}
  .dot:nth-child(2){animation-delay:.2s}
  .dot:nth-child(3){animation-delay:.4s}
  @keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none;opacity:.6}}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">擇木<span>出貨</span></div>
    <div id="wait">
      <p>正在開啟系統<br><span class="dot"></span><span class="dot"></span><span class="dot"></span></p>
      <p style="font-size:12.5px">沒有自動跳轉的話，按下面的按鈕。</p>
      <a class="btn" id="go" href="#">開啟出貨管理</a>
    </div>
  </div>
<script>
  (function(){
    var bad = APP_URL.indexOf("/macros/s/") < 0;
    if (bad) {
      document.getElementById("wait").innerHTML =
        '<p style="color:#F7DEDC">這個頁面還沒設定後端網址。<br>' +
        '請編輯 index.html，把 APP_URL 換成 Apps Script 的 /exec 網址。</p>';
      return;
    }
    document.getElementById("go").href = APP_URL;
    location.replace(APP_URL);
  })();
</script>
</body>
</html>
